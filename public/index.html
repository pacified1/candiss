<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Us ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f5;
            color: #333;
        }

        .app {
            max-width: 500px;
            height: 100vh;
            margin: auto;
            display: flex;
            flex-direction: column;
            background: white;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #ff5c8a;
            color: white;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        #login {
            padding: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 6px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            cursor: pointer;
            font-size: 15px;
        }

        #loginButton {
            width: 100%;
            background: #ff5c8a;
            color: white;
            margin-top: 10px;
        }

        #chat {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .message {
            margin: 10px 0;
            padding: 10px 14px;
            border-radius: 15px;
            max-width: 80%;
        }

        .mine {
            margin-left: auto;
            background: #ff5c8a;
            color: white;
        }

        .theirs {
            margin-right: auto;
            background: #eee;
        }

        .sender {
            font-size: 11px;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        #composer {
            padding: 10px;
            border-top: 1px solid #eee;
        }

        #messageInput {
            width: 100%;
        }

        .buttons {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        #sendButton {
            flex: 1;
            background: #ff5c8a;
            color: white;
        }

        #notifyButton {
            background: #ffe1ea;
            color: #d72f61;
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <h1>Us ❤️</h1>
    </header>

    <!-- LOGIN -->

    <div id="login">

        <h2>Our private space ❤️</h2>

        <input
            id="username"
            placeholder="Username"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <button id="loginButton">
            Enter ❤️
        </button>

        <p id="loginError"></p>

    </div>

    <!-- CHAT -->

    <div id="chat">

        <div id="messages"></div>

        <div id="composer">

            <input
                id="messageInput"
                placeholder="Type something..."
            >

            <div class="buttons">

                <button id="sendButton">
                    Send ❤️
                </button>

                <button id="notifyButton">
                    🔔 Send as notification
                </button>

            </div>

        </div>

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let currentUser = null;

const loginScreen = document.getElementById("login");
const chatScreen = document.getElementById("chat");

const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");

const loginButton = document.getElementById("loginButton");
const loginError = document.getElementById("loginError");

const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const notifyButton = document.getElementById("notifyButton");

const messages = document.getElementById("messages");


/* -------------------------
   LOGIN
------------------------- */

loginButton.onclick = () => {

    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    socket.emit("login", {
        username,
        password
    });
};


socket.on("login_success", ({ username }) => {

    currentUser = username;

    loginScreen.style.display = "none";
    chatScreen.style.display = "flex";

});


socket.on("login_failed", () => {

    loginError.textContent =
        "Wrong username or password.";

});


/* -------------------------
   SEND MESSAGE
------------------------- */

function sendMessage(notify = false) {

    const text = messageInput.value.trim();

    if (!text) return;

    socket.emit("send_message", {
        text,
        notify
    });

    messageInput.value = "";
}


sendButton.onclick = () => {
    sendMessage(false);
};


notifyButton.onclick = () => {
    sendMessage(true);
};


/* Enter key */

messageInput.addEventListener("keydown", (event) => {

    if (event.key === "Enter") {
        sendMessage(false);
    }

});


/* -------------------------
   RECEIVE MESSAGE
------------------------- */

socket.on("new_message", (message) => {

    const div = document.createElement("div");

    div.className =
        "message " +
        (message.sender === currentUser
            ? "mine"
            : "theirs");

    div.innerHTML = `
        <div class="sender">
            ${escapeHtml(message.sender)}
        </div>

        <div>
            ${escapeHtml(message.text)}
        </div>
    `;

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;

});


/* -------------------------
   SECURITY
------------------------- */

function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

</script>

</body>
</html>
